<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--p:#1c1c1e;--p2:#2c2c2e;--ink:#fff;--dim:#8e8e93;--acc:#0a84ff;--bad:#ff453a;--line:rgba(255,255,255,.12);--glass:rgba(120,120,128,.32)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:Vazirmatn,system-ui,sans-serif;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
svg{stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
[hidden]{display:none!important}

/* lock */
#lock{position:fixed;inset:0;display:grid;place-items:center;padding:1.5rem;background:radial-gradient(circle at 50% 18%,#1d2b4d,#000 68%);z-index:50}
#lock form{width:min(330px,100%);display:grid;gap:.8rem;text-align:center}
.mark{width:84px;height:84px;margin:0 auto .4rem;border-radius:26px;background:var(--glass);backdrop-filter:blur(20px);display:grid;place-items:center}
.mark svg{width:38px;height:38px;color:var(--acc)}
h1{font-size:2rem;font-weight:800}
.sub,#msg{color:var(--dim);font-size:.9rem}
#msg{color:var(--bad);min-height:1.4em}
input[type=password]{width:100%;font:inherit;color:var(--ink);background:var(--p);border:0;border-radius:14px;padding:.85rem 1rem;direction:ltr;text-align:center}
.main{background:var(--acc);color:#fff;font-weight:600;border-radius:14px;padding:.85rem}
.main:disabled{opacity:.5}

/* app */
#app{display:none}
header{position:sticky;top:0;z-index:10;padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;background:rgba(0,0,0,.7);backdrop-filter:blur(24px) saturate(1.8);-webkit-backdrop-filter:blur(24px) saturate(1.8)}
.top{display:flex;align-items:center;justify-content:space-between;gap:.5rem}
.top div{display:flex;gap:.45rem}
.pill{background:var(--glass);border-radius:999px;padding:.38rem 1rem;font-size:.92rem;color:var(--acc);font-weight:600}
.pill.red{color:var(--bad)}
.ic{width:36px;height:36px;border-radius:50%;background:var(--glass);display:grid;place-items:center;color:var(--acc)}
.ic svg{width:18px;height:18px}
h2{font-size:2.05rem;font-weight:800;margin-top:8px;line-height:1.3}
#count{color:var(--dim);font-size:.85rem}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:2px;padding:2px 0 calc(120px + env(safe-area-inset-bottom))}
.tile{position:relative;aspect-ratio:1;background:var(--p);overflow:hidden;cursor:pointer}
.tile img{width:100%;height:100%;object-fit:cover;display:block;animation:fade .4s;transition:transform .18s,border-radius .18s}
@keyframes fade{from{opacity:0}}
.dur{position:absolute;bottom:5px;inset-inline-end:7px;font-size:.74rem;font-weight:600;text-shadow:0 1px 4px #000c;direction:ltr}
.vi{position:absolute;top:6px;inset-inline-start:7px;width:15px;height:15px;filter:drop-shadow(0 1px 3px #000a)}
.tile.sel img{transform:scale(.84);border-radius:10px}
.rg{display:none}
body.selm .tile::after,body.selm .rg{content:"";display:block;position:absolute;bottom:6px;inset-inline-start:6px;width:22px;height:22px;border-radius:50%;border:2px solid #fff;background:rgba(0,0,0,.25)}
body.selm .sel::after,body.selm .sel .rg{background:var(--acc);border-color:#fff}
body.selm .sel::after{content:"✓";color:#fff;font-size:.8rem;font-weight:800;display:grid;place-items:center}
#flist{padding:4px 16px calc(120px + env(safe-area-inset-bottom))}
.frow{position:relative;display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer}
.fi{flex:none;width:42px;height:52px;border-radius:9px;background:var(--p2);display:grid;place-items:center;font-size:.66rem;font-weight:800;color:var(--acc);direction:ltr}
.fn{flex:1;min-width:0}
.fn b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;unicode-bidi:plaintext}
.fn span{color:var(--dim);font-size:.8rem}
.frow .rg{position:static}
body.selm .frow .rg{position:static;flex:none}
#empty{text-align:center;color:var(--dim);padding:6rem 1.5rem;line-height:2}
#tabs{position:fixed;inset-inline:0;bottom:calc(12px + env(safe-area-inset-bottom));margin:auto;width:min(360px,calc(100% - 32px));display:none;z-index:20;background:rgba(44,44,46,.7);backdrop-filter:blur(28px) saturate(1.8);-webkit-backdrop-filter:blur(28px) saturate(1.8);border:1px solid var(--line);border-radius:999px;padding:5px;box-shadow:0 10px 34px #000a}
#tabs button{flex:1;display:grid;justify-items:center;gap:1px;padding:6px 0 5px;border-radius:999px;font-size:.72rem;color:var(--dim);transition:background .2s,color .2s}
#tabs button.on{background:rgba(255,255,255,.14);color:var(--acc)}
#tabs svg{width:23px;height:23px}
#status{position:fixed;top:calc(12px + env(safe-area-inset-top));inset-inline:0;margin:auto;width:max-content;max-width:90%;background:rgba(44,44,46,.85);backdrop-filter:blur(20px);border-radius:999px;padding:.5rem 1.2rem;font-size:.9rem;display:none;z-index:70}
body.drag::before{content:"فایلەکان لێرە بخە";position:fixed;inset:10px;z-index:60;display:grid;place-items:center;border:2px dashed var(--acc);border-radius:24px;background:rgba(0,0,0,.88);font-size:1.4rem}

/* viewer */
#viewer{position:fixed;inset:0;z-index:30;background:#000;display:none;grid-template-rows:auto 1fr}
#viewer.open{display:grid;animation:fade .2s}
#vbar{display:flex;gap:.5rem;justify-content:space-between;align-items:center;padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;background:rgba(0,0,0,.6);backdrop-filter:blur(20px)}
#vbar div{display:flex;gap:.45rem}
#vname{color:var(--dim);font-size:.8rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:ltr;flex:1;text-align:center;min-width:0}
#stage{display:grid;place-items:center;min-height:0;padding:0 0 env(safe-area-inset-bottom);touch-action:pan-y}
#media{display:grid;place-items:center;width:100%;height:100%}
#stage img,#stage video{max-width:100%;max-height:100%;animation:fade .25s}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div id="lock">
  <form id="lf" autocomplete="off">
    <div class="mark"><svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></div>
    <h1>گەنجینە</h1>
    <p class="sub" id="hint">وشەی نهێنی بنووسە</p>
    <input type="password" id="pw" placeholder="وشەی نهێنی" autocomplete="current-password">
    <input type="password" id="pw2" placeholder="دووبارەی بکەرەوە" style="display:none">
    <p id="msg"></p>
    <button class="main" id="go">کردنەوە</button>
  </form>
</div>

<div id="app">
  <header>
    <div class="top">
      <button class="pill" id="selbtn">هەڵبژاردن</button>
      <div>
        <button class="pill red" id="delsel" hidden>سڕینەوە</button>
        <button class="ic" id="lockbtn" aria-label="داخستن"><svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></button>
        <button class="ic" id="add" aria-label="زیادکردن"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
      </div>
    </div>
    <h2 id="title"></h2>
    <div id="count"></div>
  </header>
  <main id="grid"></main>
  <div id="flist" hidden></div>
  <p id="empty" hidden></p>
</div>

<nav id="tabs">
  <button data-f="image"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="1.6"/><path d="m4 18 5-5 4 4 3-3 4 4"/></svg>وێنەکان</button>
  <button data-f="video"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="13" height="12" rx="3"/><path d="m16 11 5-3v8l-5-3"/></svg>ڤیدیۆکان</button>
  <button data-f="file"><svg viewBox="0 0 24 24"><path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5"/></svg>فایلەکان</button>
</nav>

<input type="file" id="file" multiple hidden>
<div id="status"></div>

<div id="viewer">
  <div id="vbar">
    <button class="pill" id="vclose">✕</button>
    <span id="vname"></span>
    <div><button class="pill" id="vsave">پاشەکەوت</button><a class="pill" id="vdl" style="text-decoration:none">داگرتن</a><button class="pill red" id="vdel">سڕینەوە</button></div>
  </div>
  <div id="stage"><div id="media"></div></div>
</div>

<script>
/* ntfy.sh topic: install the "ntfy" app and subscribe to this topic to get alerts */
const TOPIC='ganjina-x7k2q9m4zt';
const $=s=>document.querySelector(s),enc=new TextEncoder(),N=n=>String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
let KEY,items=[],byId=new Map(),filter='image',selMode=false,sel=new Set(),thumbs=new Map(),list=[],cur=-1,curUrl=null,curBlob=null,token=0;

/* ---------- notify when someone else opens ---------- */
const isOwner=()=>{try{return localStorage.getItem('gj_owner')==='1'}catch{return false}};
const setOwner=()=>{try{localStorage.setItem('gj_owner','1')}catch{}};
function ping(t){try{fetch('https://ntfy.sh/'+TOPIC,{method:'POST',body:t+'\n'+new Date().toLocaleString('en-GB')+'\n'+((navigator.userAgent.match(/\(([^)]+)\)/)||[])[1]||'')}).catch(()=>{});}catch{}}
if(!isOwner())ping('👀 کەسێک گەنجینەی کردەوە');

/* ---------- storage (IndexedDB) ---------- */
const DB=new Promise((res,rej)=>{
  const r=indexedDB.open('ganjina',1);
  r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore('meta');d.createObjectStore('items',{keyPath:'id',autoIncrement:true});d.createObjectStore('blobs');};
  r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);
});
async function tx(store,mode,fn){
  const d=await DB;
  return new Promise((res,rej)=>{const t=d.transaction(store,mode);const o=fn(t.objectStore(store));t.oncomplete=()=>res(o&&o.result);t.onerror=()=>rej(t.error);});
}

/* ---------- crypto (AES-GCM, key from password via PBKDF2) ---------- */
async function derive(pw,salt){
  const m=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:250000,hash:'SHA-256'},m,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
async function seal(buf){const iv=crypto.getRandomValues(new Uint8Array(12));return{iv,ct:await crypto.subtle.encrypt({name:'AES-GCM',iv},KEY,buf)};}
const unseal=(iv,ct)=>crypto.subtle.decrypt({name:'AES-GCM',iv},KEY,ct);

/* ---------- lock screen ---------- */
(async()=>{
  const auth=await tx('meta','readonly',s=>s.get('auth'));
  if(!auth){$('#pw2').style.display='block';$('#hint').textContent='یەکەم جار: وشەیەکی نهێنی دابنێ';$('#go').textContent='دروستکردن';}
  $('#pw').focus();
})();
$('#lf').onsubmit=async e=>{
  e.preventDefault();
  const pw=$('#pw').value,msg=t=>$('#msg').textContent=t;msg('');
  if(!pw)return;
  $('#go').disabled=true;
  try{
    const auth=await tx('meta','readonly',s=>s.get('auth'));
    if(!auth){
      if(pw.length<8){msg('وشەی نهێنی دەبێت لانی کەم ٨ پیت بێت');return;}
      if(pw!==$('#pw2').value){msg('هەردوو وشەکە وەک یەک نین');return;}
      const salt=crypto.getRandomValues(new Uint8Array(16));
      KEY=await derive(pw,salt);
      const s=await seal(enc.encode('ok'));
      await tx('meta','readwrite',st=>st.put({salt,iv:s.iv,ct:s.ct},'auth'));
      navigator.storage?.persist?.();
    }else{
      const k=await derive(pw,auth.salt);
      try{await crypto.subtle.decrypt({name:'AES-GCM',iv:auth.iv},k,auth.ct);}
      catch{if(!isOwner())ping('🔐 کەسێک وشەی نهێنی هەڵەی تاقیکردەوە');await new Promise(r=>setTimeout(r,1200));msg('وشەی نهێنی هەڵەیە');return;}
      KEY=k;
    }
    setOwner();
    await start();
  }finally{$('#go').disabled=false;}
};
async function start(){
  items=await tx('items','readonly',s=>s.getAll());
  byId=new Map(items.map(m=>[m.id,m]));
  $('#lock').style.display='none';$('#app').style.display='block';$('#tabs').style.display='flex';$('#pw').value=$('#pw2').value='';
  render();armIdle();
}
const lockNow=()=>location.reload();
$('#lockbtn').onclick=lockNow;
let idleT;function armIdle(){const r=()=>{clearTimeout(idleT);idleT=setTimeout(lockNow,5*60*1000);};['pointerdown','keydown','scroll','touchstart'].forEach(ev=>addEventListener(ev,r,{passive:true}));r();}

/* ---------- gallery ---------- */
const SEC={
  image:{t:'وێنەکان',u:'وێنە',acc:'image/*',e:'هێشتا هیچ وێنەیەک نییە.<br>بە دوگمەی + وێنە زیاد بکە.'},
  video:{t:'ڤیدیۆکان',u:'ڤیدیۆ',acc:'video/*',e:'هێشتا هیچ ڤیدیۆیەک نییە.<br>بە دوگمەی + ڤیدیۆ زیاد بکە.'},
  file:{t:'فایلەکان',u:'فایل',acc:'',e:'هێشتا هیچ فایلێک نییە.<br>بە دوگمەی + فایل زیاد بکە.'}
};
const fmt=s=>{s=Math.round(s||0);return N(Math.floor(s/60)+':'+String(s%60).padStart(2,'0'));};
const sz=b=>b>=1048576?N((b/1048576).toFixed(1))+' MB':N(Math.max(1,Math.round(b/1024)))+' KB';
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){io.unobserve(e.target);loadThumb(e.target);}}),{rootMargin:'600px'});
async function loadThumb(d){
  const m=byId.get(+d.dataset.id);if(!m||!m.tCt)return;
  let url=thumbs.get(m.id);
  if(!url){url=URL.createObjectURL(new Blob([await unseal(m.tIv,m.tCt)],{type:'image/jpeg'}));thumbs.set(m.id,url);}
  const img=new Image();img.src=url;img.alt='';img.decoding='async';d.prepend(img);
}
function render(){
  const S=SEC[filter],g=$('#grid'),f=$('#flist');
  list=items.filter(m=>m.type===filter).sort((a,b)=>b.added-a.added);
  $('#title').textContent=S.t;$('#count').textContent=list.length?N(list.length)+' '+S.u:'';
  g.innerHTML=f.innerHTML='';g.hidden=filter==='file';f.hidden=filter!=='file';
  $('#empty').hidden=list.length>0;$('#empty').innerHTML=S.e;
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.f===filter));
  list.forEach((m,i)=>{
    const d=document.createElement('div');d.dataset.id=m.id;
    if(filter==='file'){
      d.className='frow'+(sel.has(m.id)?' sel':'');
      d.innerHTML='<div class="fn"><b></b><span></span></div><i class="rg"></i>';
      const fi=document.createElement('div');fi.className='fi';fi.textContent=((m.name.split('.').length>1&&m.name.split('.').pop())||'FILE').slice(0,4).toUpperCase();d.prepend(fi);
      d.querySelector('b').textContent=m.name;d.querySelector('span').textContent=sz(m.size||0);
      d.onclick=()=>selMode?toggle(m.id,d):dl(m);f.append(d);
    }else{
      d.className='tile'+(sel.has(m.id)?' sel':'');
      if(m.type==='video'){
        d.insertAdjacentHTML('beforeend','<svg class="vi" viewBox="0 0 24 24" style="stroke:#fff;fill:#fff"><path d="M7 5l12 7-12 7z"/></svg><i class="dur" style="font-style:normal"></i>');
        d.querySelector('.dur').textContent=m.dur?fmt(m.dur):'';
      }
      d.onclick=()=>selMode?toggle(m.id,d):show(i);g.append(d);io.observe(d);
    }
  });
}
function setTab(f){filter=f;sel.clear();$('#delsel').textContent='سڕینەوە';scrollTo(0,0);render();}
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>setTab(b.dataset.f));
async function dl(m){
  const b=await tx('blobs','readonly',s=>s.get(m.id));const buf=await unseal(b.iv,b.ct);
  const u=URL.createObjectURL(new Blob([buf],{type:m.mime||'application/octet-stream'}));
  const a=document.createElement('a');a.href=u;a.download=m.name;a.click();setTimeout(()=>URL.revokeObjectURL(u),5000);
}

/* ---------- selection / delete ---------- */
function toggle(id,d){sel.has(id)?sel.delete(id):sel.add(id);d.classList.toggle('sel');$('#delsel').textContent=`سڕینەوە (${N(sel.size)})`;}
$('#selbtn').onclick=()=>{selMode=!selMode;sel.clear();document.body.classList.toggle('selm',selMode);$('#selbtn').textContent=selMode?'تەواو':'هەڵبژاردن';$('#delsel').hidden=!selMode;$('#delsel').textContent='سڕینەوە';render();};
async function removeIds(ids){
  for(const id of ids){await tx('items','readwrite',s=>s.delete(id));await tx('blobs','readwrite',s=>s.delete(id));
    const u=thumbs.get(id);if(u){URL.revokeObjectURL(u);thumbs.delete(id);}byId.delete(id);}
  items=items.filter(m=>!ids.includes(m.id));
}
$('#delsel').onclick=async()=>{
  if(!sel.size||!confirm(`${N(sel.size)} فایل بسڕدرێنەوە؟ ناگەڕێنرێتەوە.`))return;
  await removeIds([...sel]);sel.clear();$('#delsel').textContent='سڕینەوە';render();
};

/* ---------- upload (auto-sorted into the 3 sections) ---------- */
const status=t=>{const s=$('#status');s.textContent=t;s.style.display=t?'block':'none';};
$('#add').onclick=()=>{const i=$('#file');i.accept=SEC[filter].acc;i.click();};
$('#file').onchange=e=>{addFiles([...e.target.files]);e.target.value='';};
addEventListener('dragover',e=>{e.preventDefault();if(KEY)document.body.classList.add('drag');});
addEventListener('dragleave',e=>{if(!e.relatedTarget)document.body.classList.remove('drag');});
addEventListener('drop',e=>{e.preventDefault();document.body.classList.remove('drag');if(KEY)addFiles([...e.dataTransfer.files]);});

async function makeThumb(f,type){
  const M=420;let w=16,h=9,dur=0,blob=null,url=null;
  try{
    let src;
    if(type==='image'){src=await createImageBitmap(f);w=src.width;h=src.height;}
    else{
      const v=document.createElement('video');v.muted=true;v.playsInline=true;v.preload='auto';url=URL.createObjectURL(f);v.src=url;
      await new Promise((r,j)=>{v.onloadeddata=r;v.onerror=j;});
      const seeked=new Promise(r=>{v.onseeked=r;setTimeout(r,3000);});
      v.currentTime=Math.min(1,(v.duration||1)/10);await seeked;
      src=v;w=v.videoWidth;h=v.videoHeight;dur=v.duration||0;
    }
    const k=Math.min(1,M/Math.max(w,h)),c=document.createElement('canvas');
    c.width=Math.round(w*k);c.height=Math.round(h*k);c.getContext('2d').drawImage(src,0,0,c.width,c.height);
    blob=await new Promise(r=>c.toBlob(r,'image/jpeg',.8));
  }catch(e){console.warn('thumb',e);}
  finally{if(url)URL.revokeObjectURL(url);}
  return{blob,w,h,dur};
}
const EXT={jpg:'image/jpeg',jpeg:'image/jpeg',png:'image/png',gif:'image/gif',webp:'image/webp',avif:'image/avif',heic:'image/heic',heif:'image/heif',bmp:'image/bmp',svg:'image/svg+xml',mp4:'video/mp4',m4v:'video/mp4',mov:'video/quicktime',webm:'video/webm',mkv:'video/x-matroska',avi:'video/x-msvideo','3gp':'video/3gpp'};
const mimeOf=f=>f.type||EXT[(f.name.split('.').pop()||'').toLowerCase()]||'';
async function addFiles(files){
  let n=0,ok=0;const types=new Set();
  for(const f of files){
    n++;status(`خەریکی زیادکردنە… ${N(n)} / ${N(files.length)}`);
    try{
      const mime=mimeOf(f),type=mime.startsWith('image/')?'image':mime.startsWith('video/')?'video':'file';
      const t=type==='file'?{blob:null,w:0,h:0,dur:0}:await makeThumb(f,type);
      const a=await seal(await f.arrayBuffer());
      const b=t.blob?await seal(await t.blob.arrayBuffer()):null;
      const meta={name:f.name,type,mime,size:f.size,added:Date.now()+n,w:t.w,h:t.h,dur:t.dur,tIv:b?.iv,tCt:b?.ct};
      const id=await tx('items','readwrite',s=>s.add(meta));meta.id=id;
      await tx('blobs','readwrite',s=>s.put({iv:a.iv,ct:a.ct},id));
      items.push(meta);byId.set(id,meta);ok++;types.add(type);
    }catch(e){console.error(e);status('هەڵە: شوێنی پێویست نەماوە یان فایلەکە زۆر گەورەیە');await new Promise(r=>setTimeout(r,2500));}
  }
  if(types.size===1)filter=[...types][0];
  render();status(ok?`${N(ok)} فایل زیاد کرا`:'');if(ok)setTimeout(()=>status(''),1800);
}

/* ---------- viewer (photos & videos) ---------- */
async function show(i){
  if(i<0||i>=list.length)return;
  cur=i;const m=list[i],my=++token;
  $('#viewer').classList.add('open');$('#vname').textContent=m.name;$('#media').innerHTML='';
  const b=await tx('blobs','readonly',s=>s.get(m.id));
  const buf=await unseal(b.iv,b.ct);if(my!==token)return;
  if(curUrl)URL.revokeObjectURL(curUrl);
  curBlob=new Blob([buf],{type:m.mime});curUrl=URL.createObjectURL(curBlob);
  const el=document.createElement(m.type==='video'?'video':'img');
  el.src=curUrl;if(m.type==='video'){el.controls=true;el.autoplay=true;el.playsInline=true;}else el.alt=m.name;
  $('#media').replaceChildren(el);
  $('#vdl').href=curUrl;$('#vdl').download=m.name;
}
function closeViewer(){token++;curBlob=null;$('#viewer').classList.remove('open');$('#media').innerHTML='';if(curUrl){URL.revokeObjectURL(curUrl);curUrl=null;}}
$('#vclose').onclick=closeViewer;
$('#vsave').onclick=async()=>{
  if(!curBlob)return;const m=list[cur];
  const file=new File([curBlob],m.name,{type:m.mime});
  if(navigator.canShare&&navigator.canShare({files:[file]})){
    try{await navigator.share({files:[file]});return;}catch(e){if(e.name==='AbortError')return;}
  }
  $('#vdl').click();
};
$('#vdel').onclick=async()=>{
  if(!confirm('ئەم فایلە بسڕدرێتەوە؟'))return;
  const id=list[cur].id;closeViewer();await removeIds([id]);render();
};
let tx0=null;
$('#stage').addEventListener('touchstart',e=>{tx0=e.touches[0].clientX;},{passive:true});
$('#stage').addEventListener('touchend',e=>{if(tx0===null)return;const dx=e.changedTouches[0].clientX-tx0;tx0=null;if(dx<-60)show(cur+1);else if(dx>60)show(cur-1);});
addEventListener('keydown',e=>{
  if(!$('#viewer').classList.contains('open'))return;
  if(e.key==='Escape')closeViewer();
  if(e.key==='ArrowLeft')show(cur+1);
  if(e.key==='ArrowRight')show(cur-1);
});
</script>
</body>
</html>
